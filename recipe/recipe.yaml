schema_version: 1

context:
  name: tinyflux
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tinyflux-${{ version }}.tar.gz
  sha256: 9dd80a66ce3b2efbebc6eadf61ad7c0b1582927a772e9670751a50515b587063

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=42
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tinyflux
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The Tiny Time-Series Database Optimized for Your Happiness
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/citrusvanilla/tinyflux

extra:
  recipe-maintainers:
    - thewchan
